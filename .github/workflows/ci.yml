name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit, training, and API tests
        run: pytest -q
      - name: Train with quality gate
        run: PYTHONPATH=src python -m parking_mlops.train
      - uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: models/metrics.json

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t parking-demand-api .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name api parking-demand-api
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"lot_code":"Lot02","timestamp":"2022-12-14T12:30:00"}'
